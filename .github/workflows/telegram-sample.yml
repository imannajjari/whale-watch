name: Telegram Sample Message

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    name: Send sample whale alerts to Telegram
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Send Sample Messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DISPLAY_TIMEZONE: ${{ secrets.TELEGRAM_DISPLAY_TIMEZONE }}
        run: dotnet run --project src/WhaleWatch -c Release -- --telegram-sample
